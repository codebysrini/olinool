# Keeps the SHA-pinned actions in .github/workflows current. A 7-day cooldown
# means a freshly published action release is not adopted until it has been
# public for a week (time for a compromised release to be caught and yanked).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
